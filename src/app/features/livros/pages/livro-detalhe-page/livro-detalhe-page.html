<main class="container">
  <a routerLink="/livros">← Voltar para livros</a>

  @if (carregando()) {
  <p>Carregando...</p>
  } @else {
  @if (livro(); as item) {
  <h1>{{ item.titulo }}</h1>
  <p>{{ item.descricao }}</p>
  <p>Autor: {{ item.autor }}</p>
  <p>Categoria: {{ item.categoria }}</p>
  <p>Ano: {{ item.ano }}</p>
  <p>Status: {{ item.status }}</p>

  <button (click)="alternarStatus()">
    Marcar como {{ item.status === "disponivel" ? "emprestado" : "disponível" }}
  </button>

  <button (click)="excluir()">Excluir livro</button>
  } @else {
  <p>Livro não encontrado.</p>
  }
  }
</main>
