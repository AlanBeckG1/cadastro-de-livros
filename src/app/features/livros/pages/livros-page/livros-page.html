<main class="container">
  <h1>Catálogo de livros</h1>

  <a routerLink="/livros/novo">+ Cadastrar novo livro</a>

  <app-filtro-livros
    [pesquisa]="pesquisa()"
    [status]="filtroStatus()"
    (pesquisaChange)="atualizarPesquisa($event)"
    (statusChange)="atualizarStatus($event)"
  />

  <app-lista-livros
    [livros]="livrosFiltrados()"
    [carregando]="carregando()"
    [erro]="erro()"
  />
</main>
